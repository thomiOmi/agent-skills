version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      bun:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
