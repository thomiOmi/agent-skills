name: Bug report
description: Report a reproducible problem in the project.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do not use this form. Follow [SECURITY.md](https://github.com/thomiOmi/agent-skills/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable set of steps to reproduce the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which release, commit, or branch is affected?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Bun or Node version, OpenCode version, and package manager.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional context
      description: Remove secrets, tokens, credentials, and personal data before posting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Report checks
      options:
        - label: I removed secrets, tokens, credentials, and personal data.
          required: true
        - label: This is not a security vulnerability.
          required: true
