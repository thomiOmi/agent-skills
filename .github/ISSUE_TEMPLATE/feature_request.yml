name: Feature request
description: Suggest an improvement to the project.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem would this feature solve, and who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or workflow you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What alternatives or workarounds have you tried?
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Skill
        - Agent
        - Slash command
        - Tool or plugin
        - Installer
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Request checks
      options:
        - label: I searched existing issues and pull requests for duplicates.
          required: true
