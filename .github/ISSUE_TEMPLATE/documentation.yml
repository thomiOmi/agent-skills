name: Documentation improvement
description: Report unclear, missing, or incorrect documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Provide the file path, URL, or section heading.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Documentation problem
      description: What is unclear, missing, outdated, or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: What wording, example, or structure would make it clearer?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Report checks
      options:
        - label: I searched existing issues and pull requests for duplicates.
          required: true
        - label: I removed secrets, tokens, credentials, and personal data.
          required: true
