name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**/SKILL.md"
      - "AGENTS.md"
      - "src/**"
      - "plugin/**"
      - "tests/**"
      - "package.json"
      - "tsconfig.json"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "skills/**/SKILL.md"
      - "AGENTS.md"
      - "src/**"
      - "plugin/**"
      - "tests/**"
      - "package.json"
      - "tsconfig.json"

jobs:
  validate-skills:
    name: Validate SKILL.md frontmatter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install skills-ref
        run: pip install skills-ref

      - name: Validate all skills
        run: |
          echo "=== Validating all SKILL.md files ==="
          FAILED=0

          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")

            if [ ! -f "$skill_dir/SKILL.md" ]; then
              echo "?  SKIP $skill_name — no SKILL.md found"
              continue
            fi

            echo -n "→ Validating $skill_name ... "

            if agentskills validate "$skill_dir" 2>&1; then
              echo "✓ PASS"
            else
              echo "? FAIL"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "=== Summary ==="
          TOTAL=$(find skills -name "SKILL.md" | wc -l)
          echo "Total skills: $TOTAL"

          if [ "$FAILED" -gt 0 ]; then
            echo "Failed: $FAILED"
            exit 1
          else
            echo "All skills passed validation ✓"
          fi

      - name: Check AGENTS.md exists and is non-empty
        run: |
          if [ ! -f "AGENTS.md" ]; then
            echo "✗ AGENTS.md not found at repo root"
            exit 1
          fi

          LINES=$(wc -l < AGENTS.md)
          if [ "$LINES" -lt 10 ]; then
            echo "✗ AGENTS.md looks too short ($LINES lines) — may be incomplete"
            exit 1
          fi

          echo "✓ AGENTS.md found ($LINES lines)"

      - name: Check AGENTS.md has no emoji
        run: |
          echo "=== Checking AGENTS.md for emoji ==="
          EMOJI_COUNT=$(grep -P '[\x{1F600}-\x{1F64F}\x{1F300}-\x{1F5FF}\x{1F680}-\x{1F6FF}\x{1F1E0}-\x{1F1FF}\x{2600}-\x{26FF}\x{2700}-\x{27BF}]' AGENTS.md | wc -l || true)
          if [ "$EMOJI_COUNT" -gt 0 ]; then
            echo "✗ AGENTS.md contains $EMOJI_COUNT emoji(s) — must use clean list format"
            exit 1
          fi
          echo "✓ AGENTS.md has no emoji"

      - name: Check skill name matches directory name
        run: |
          echo "=== Checking name field matches directory ==="
          FAILED=0

          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")

            if [ ! -f "$skill_dir/SKILL.md" ]; then
              continue
            fi

            name_field=$(grep "^name:" "$skill_dir/SKILL.md" | head -1 | sed 's/^name: *//')

            if [ "$name_field" = "$skill_name" ]; then
              echo "✓ $skill_name — name matches directory"
            else
              echo "? $skill_name — name field '$name_field' does not match directory '$skill_name'"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi

      - name: Check description length
        run: |
          echo "=== Checking description lengths ==="
          FAILED=0

          for skill_dir in skills/*/; do
            skill_name=$(basename "$skill_dir")

            if [ ! -f "$skill_dir/SKILL.md" ]; then
              continue
            fi

            desc=$(grep "^description:" "$skill_dir/SKILL.md" | head -1 | sed 's/^description: *//')
            len=${#desc}

            if [ "$len" -eq 0 ]; then
              echo "? $skill_name — description is empty"
              FAILED=$((FAILED + 1))
            elif [ "$len" -gt 1024 ]; then
              echo "? $skill_name — description too long ($len chars, max 1024)"
              FAILED=$((FAILED + 1))
            else
              echo "✓ $skill_name — description OK ($len chars)"
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            exit 1
          fi

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: TypeScript typecheck
        run: bun run typecheck

  lint:
    name: Lint (oxlint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint (oxlint)
        run: bun run lint

  format:
    name: Format (oxfmt)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check format (oxfmt)
        run: bun run fmt:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun run test
